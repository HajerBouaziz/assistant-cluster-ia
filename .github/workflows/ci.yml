name: CI

# Le pipeline se déclenche à chaque push et à chaque pull request
on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Installer les dépendances
        run: pip install -r requirements-dev.txt

      - name: Vérifier la qualité du code (ruff)
        run: ruff check .

      - name: Lancer les tests (pytest)
        run: pytest -v

  docker:
    # Ne construit l'image que si les tests sont passés
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Construire l'image Docker
        run: docker build -t assistant-cluster-ia .
      - name: Tester le conteneur
        run: |
          docker run -d -p 5000:5000 --name api assistant-cluster-ia
          sleep 5
          curl --fail http://localhost:5000/api/sante

  publier:
    # Livraison continue : publie l'image si tout est vert, seulement sur la branche main
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Se connecter au registre GitHub (ghcr.io)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construire et publier l'image
        run: |
          IMAGE=$(echo "ghcr.io/${{ github.repository_owner }}/assistant-cluster-ia" | tr '[:upper:]' '[:lower:]')
          docker build -t $IMAGE:${{ github.sha }} -t $IMAGE:latest .
          docker push $IMAGE:${{ github.sha }}
          docker push $IMAGE:latest

  deployer-kubernetes:
    # Déploiement continu sur un cluster Kubernetes de test (kind), créé pour l'occasion
    needs: docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Construire l'image
        run: docker build -t assistant-cluster-ia:ci .

      - name: Créer un cluster Kubernetes de test (kind)
        uses: helm/kind-action@v1
        with:
          cluster_name: test

      - name: Charger l'image dans le cluster
        run: kind load docker-image assistant-cluster-ia:ci --name test

      - name: Déployer l'application
        run: |
          kubectl apply -f k8s/deployment.yaml
          kubectl rollout status deployment/assistant-api --timeout=180s
          kubectl get pods

      - name: Tester l'application déployée
        run: |
          kubectl port-forward service/assistant-api 8080:80 &
          sleep 5
          curl --fail http://localhost:8080/api/sante