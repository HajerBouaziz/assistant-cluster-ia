name: CI

# Le pipeline se déclenche à chaque push et à chaque pull request
on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Installer les dépendances
        run: pip install -r requirements-dev.txt

      - name: Vérifier la qualité du code (ruff)
        run: ruff check .

      - name: Lancer les tests (pytest)
        run: pytest -v

  docker:
    # Ne construit l'image que si les tests sont passés
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Construire l'image Docker
        run: docker build -t assistant-cluster-ia .
      - name: Tester le conteneur
        run: |
          docker run -d -p 5000:5000 --name api assistant-cluster-ia
          sleep 5
          curl --fail http://localhost:5000/api/sante
