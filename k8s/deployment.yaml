apiVersion: apps/v1
kind: Deployment
metadata:
  name: assistant-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: assistant-api
  template:
    metadata:
      labels:
        app: assistant-api
    spec:
      containers:
        - name: api
          image: assistant-cluster-ia:ci
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          readinessProbe:
            httpGet:
              path: /api/sante
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/sante
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: assistant-api
spec:
  selector:
    app: assistant-api
  ports:
    - port: 80
      targetPort: 5000